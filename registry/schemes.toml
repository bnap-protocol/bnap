  { kind = "mpp-challenge", embeds = "the challenge's HMAC'd id carries the OfferID", credential = "the MPP credential, the Authorization: Payment value as received" },
  { kind = "bolt11", embeds = "the invoice description hash is the OfferID", credential = "the MPP credential, the Authorization: Payment value as received" },
]
