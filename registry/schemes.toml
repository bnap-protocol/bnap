# BNAP scheme registry: credential and attestation schemes.
#
# One entry per system in the overview's plug catalogue. A catalogue row that
# names two binding classes for one system gets one ID per class, because an
# entry has exactly one class and a plug can never declare its own.
# The entry layout follows draft-00 section 11; registry/README.md documents
# every field. Check with: python3 -I registry/validate.py
#
# Every entry here is status = "provisional": its vector is the designated
# expert's reading of the scheme's specification, set before any conformance
# suite existed. Where a value depends on the deployment, or the
# specification does not settle it, the entry takes the weakest value.

format = 1

# ------------------------------------------------------------ credentials

[scheme."bnap:notes"]
name = "Blind notes"
kind = "credential"
role = "value"
status = "provisional"
source = "overview, Plug catalogue: Blind notes (bnap:notes); draft-00 section 11 example"
spec = "https://github.com/bnap-protocol/bnap/blob/develop/spec/schemes/bnap-notes.md"
binding = "S"
use = "single"
refund = "atomic"
upto = false
properties = { theft = "key-witnessed", link-payment = "unlinkable", link-actions = "unlinkable", issuer = "self-issued", verify = "offline", finality = "final-on-verification", custody = "operator-iou", pq = "no", maturity = "experimental" }
local_id = "Y of each input, 33-byte compressed point"
quota_id = ""
rail_refs = "none at spend; the funding payment at minting, confirmed by the rail"
rail_kinds = ["ln"]
verifiers = ["local"]
body = "TLV, per the bnap:notes scheme spec (DECISIONS row 31)"
witness = "one BIP-340 signature per input, over the Digest"
native = []
units = ["sat"]
conformance = ""
notes = "The default scheme; this entry is the draft-00 section 11 example. link-payment is unlinkable except that the first action after funding can be correlated by timing. Funded through a reversible or linkable rail, the effective vector drops to that rail's values. The scheme spec is still in its v0.4 form until the draft-00 rewrite of DECISIONS row 31 lands."

[scheme."httpauth:L402"]
name = "L402"
kind = "credential"
role = "value"
status = "provisional"
source = "overview, Plug catalogue: L402 (bLIP-26)"
spec = "https://github.com/lightning/blips/pull/26"
binding = "O"
use = "single"
refund = "none"
upto = false
properties = { theft = "bearer", link-payment = "linkable", link-actions = "unlinkable", issuer = "self-issued", verify = "offline", finality = "final-on-verification", custody = "self-custody", pq = "no", maturity = "experimental" }
local_id = "the payment hash committed in the macaroon, 32 bytes"
quota_id = ""
rail_refs = "ln: the payment hash committed in the macaroon"
rail_kinds = ["ln"]
verifiers = ["local"]
body = "the L402 token, macaroon:preimage, as the client would send it natively"
witness = "none: class O has no witness"
native = [
  { kind = "l402-macaroon", embeds = "a first-party caveat bnap_offer = hex(OfferID)", credential = "the L402 token macaroon:preimage (draft-00 5.4)" },
  { kind = "bolt11", embeds = "the invoice description hash is the OfferID", credential = "the L402 token macaroon:preimage (draft-00 5.4)" },
]
units = ["sat"]
conformance = ""
notes = "Reusable natively, single in BNAP (draft-00 6.2). bLIP-26 is an open pull request, so the entry cites the PR (ERRATA row 34); the adapter accepts token= and macaroon=, and both the L402 and LSAT scheme names. Neither refund nor upto, so metered routes give it exact-scope offers priced at the ceiling (draft-00 10.3). One Lightning payment shares one ln RailId with payment:lightning/charge and x402 on Lightning."

