# ------------------------------------------------------------ attestations

[scheme."pp:0x0002"]
name = "Privacy Pass, publicly verifiable tokens (blind RSA)"
kind = "attestation"
role = "attestation"
status = "provisional"
source = "overview, Plug catalogue: Privacy Pass (RFC 9576-9578)"
spec = "https://www.rfc-editor.org/rfc/rfc9578.html"
binding = "O"
use = "single"
properties = { theft = "bearer", link-actions = "unlinkable", issuer = "third-party", verify = "offline", pq = "no", maturity = "standard" }
local_id = "the token's nonce, 32 bytes"
quota_id = ""
verifiers = ["local"]
body = "the token, as RFC 9577 sends it in Authorization: PrivateToken"
witness = "none: class O has no witness"
conformance = ""
notes = "Token type 0x0002 (RFC 9578, blind RSA, publicly verifiable); other token types, such as 0x0001, need entries of their own. The redemption context is the OfferID, so the client builds the token challenge from the attest entry's params and needs no native. Token IDs change with every token, so the scheme cannot carry a quota (draft-00 6.2)."

[scheme."vnd.cfrg.arc"]
name = "Anonymous Rate-Limited Credentials (ARC)"
kind = "attestation"
role = "attestation"
status = "provisional"
source = "overview, Plug catalogue: ARC"
spec = "https://datatracker.ietf.org/doc/draft-yun-cfrg-arc/"
binding = "O"
use = "rate"
properties = { theft = "bearer", link-actions = "unlinkable", issuer = "third-party", verify = "online", pq = "no", maturity = "experimental" }
local_id = "the presentation tag, as the adapter spec will define it"
quota_id = ""
verifiers = ["local"]
body = "an ARC presentation whose presentation context is the OfferID"
witness = "none: class O has no witness"
conformance = ""
notes = "ARC tags differ per presentation, so the socket cannot key a rate(k, epoch) counter on them (draft-00 6.2); the limit comes from ARC's own presentation limit. The entry keeps the catalogue's use = rate, the weaker reading, until the expert settles it. ARC is privately verifiable, so an issuer other than the operator must be online. The ID sits in the vnd. tree until ARC has a Privacy Pass token type."

[scheme."httpsig:web-bot-auth"]
name = "Web Bot Auth"
kind = "attestation"
role = "attestation"
status = "provisional"
source = "overview, Plug catalogue: Web Bot Auth"
spec = "https://www.ietf.org/archive/id/draft-meunier-webbotauth-httpsig-protocol-00.html"
binding = "A"
use = "reusable"
properties = { theft = "bearer", link-actions = "linkable", issuer = "third-party", verify = "online", pq = "no", maturity = "experimental" }
local_id = "the JWK thumbprint of the bot's signing key"
quota_id = "the JWK thumbprint of the bot's signing key"
verifiers = ["local"]
body = "the Signature, Signature-Input and, if sent, Signature-Agent field values, copied by the client; the signature covers BNAP-Context"
witness = "none: class A; the signature sits in the body and covers the Context, not the Digest"
conformance = ""
notes = "The adapter builds the signature base from the gate's own Context and scope inputs, never from raw request fields (draft-00 5.1). The key comes from the bot operator's key directory, so the issuer is a third party reached online. Draft-00 10.3 uses it for a 20% discount in a route-scope offer, which needs class S or A."

[scheme."httpauth:DPoP"]
name = "OAuth access tokens and API keys, with DPoP"
kind = "attestation"
role = "attestation"
status = "provisional"
source = "overview, Plug catalogue: OAuth and API keys, with DPoP"
spec = "https://www.rfc-editor.org/rfc/rfc9449.html"
binding = "A"
use = "reusable"
properties = { theft = "bearer", link-actions = "linkable", issuer = "third-party", verify = "online", pq = "no", maturity = "standard" }
local_id = "the DPoP key's JWK thumbprint (RFC 7638), the token's cnf.jkt"
quota_id = "the DPoP key's JWK thumbprint (RFC 7638), the token's cnf.jkt"
verifiers = ["local"]
body = "the access token and the DPoP proof, with the Context in a proof claim, copied by the client"
witness = "none: class A; the proof sits in the body and covers the Context, not the Digest"
conformance = ""
notes = "Class A through a DPoP claim that carries the Context; the claim name is for the adapter spec. Without DPoP the same tokens are httpauth:Bearer, class none. The draft-00 attestation-only vector uses it as a waive. Tokens may need introspection at the authorization server, so the issuer is a third party reached online."

[scheme."httpauth:Bearer"]
name = "OAuth bearer tokens and API keys, without DPoP"
kind = "attestation"
role = "attestation"
status = "provisional"
source = "overview, Plug catalogue: OAuth and API keys, with DPoP"
spec = "https://www.rfc-editor.org/rfc/rfc6750.html"
binding = "none"
use = "reusable"
properties = { theft = "bearer", link-actions = "linkable", issuer = "third-party", verify = "online", pq = "no", maturity = "standard" }
local_id = "SHA-256 of the token"
quota_id = ""
verifiers = ["local"]
body = "the bearer token or API key, copied by the client"
witness = "none: class none has no witness"
conformance = ""
notes = "Class none: usable only with effect required, never to waive, discount or carry a quota (draft-00 7). The overview's route example rests on this entry: a reusable bearer token can never admit a route that requires use = single. API keys sent in other fields use this entry too; the adapter copies the key into the body."

[scheme."nip:98"]
name = "Nostr HTTP Auth (NIP-98)"
kind = "attestation"
role = "attestation"
status = "provisional"
source = "overview, Plug catalogue: NIP-98"
spec = "https://github.com/nostr-protocol/nips/blob/master/98.md"
binding = "A"
use = "reusable"
properties = { theft = "bearer", link-actions = "linkable", issuer = "third-party", verify = "offline", pq = "no", maturity = "experimental" }
local_id = "the event's public key, 32-byte x-only key"
quota_id = "the event's public key, 32-byte x-only key"
verifiers = ["local"]
body = "the signed kind 27235 event, with the Context in a tag"
witness = "none: class A; the event signature sits in the body and covers the Context, not the Digest"
conformance = ""
notes = "A Nostr key is self-asserted and nobody vouches for it, so the entry takes the weakest issuer value. Verification is a Schnorr check with no network. NIP-98 is marked draft in the NIPs repository. The Nostr carrier has its own entry."

[scheme."vnd.world.world-id"]
name = "World ID"
kind = "attestation"
role = "attestation"
status = "provisional"
source = "overview, Plug catalogue: World ID"
spec = "https://docs.world.org/world-id"
binding = "A"
use = "rate"
properties = { theft = "bearer", link-actions = "linkable", issuer = "third-party", verify = "online", pq = "no", maturity = "experimental" }
local_id = "the nullifier hash for the action"
quota_id = ""
verifiers = ["local"]
body = "the World ID proof, with the Context as its signal"
witness = "none: class A; the proof sits in the body and covers the Context, not the Digest"
conformance = ""
notes = "The nullifier is stable per person and action, so the rate model can count it, and actions under one action ID are linkable to each other. A quota could count it too; quota_id stays empty until the adapter spec names the action. Proofs are checked through World's verifier, so online."

# ------------------------------------------------------------ does not fit

[scheme."vnd.cloudflare.pay-per-crawl"]
name = "Cloudflare pay per crawl"
kind = "credential"
role = "value"
status = "does-not-fit"
source = "overview, Plug catalogue: Cloudflare pay-per-crawl"
spec = "https://developers.cloudflare.com/ai-crawl-control/features/pay-per-crawl/what-is-pay-per-crawl/"
reason = "Its payment side is closed: Cloudflare is the merchant of record and settles with the crawler on its own account, so the gate receives no payment artifact it can verify, bind to an offer or commit."
notes = "Fits only as a Pricer signal, as the overview says: its 402 price can inform what a BNAP route charges. In closed beta when checked."

[scheme."vnd.google.ap2"]
name = "Agent Payments Protocol (AP2), as a direct per-action payment"
kind = "credential"
role = "value"
status = "does-not-fit"
source = "overview, Plug catalogue: introduction and the AP2 mandates row"
spec = "https://ap2-protocol.org"
reason = "AP2 authorizes a payment with signed mandates and leaves the payment itself to another method, cards in its first version, so it carries no value proof the gate can verify for one action."
notes = "AP2 mandates do fit, as a client spend policy, which is a client plug and has no registry entry. A payment method that AP2 drives, such as a card through MPP, is registered under that method."
