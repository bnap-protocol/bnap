local_id = "the invoice's payment hash, 32 bytes"
quota_id = ""
rail_refs = "ln: the invoice's payment hash"
rail_kinds = ["ln"]
verifiers = ["local", "mpp-processor"]
body = "the MPP credential, the Authorization: Payment value as received"
witness = "none: class O has no witness"
