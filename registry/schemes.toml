[scheme."x402:exact@eip155:8453"]
name = "x402 exact on Base (EVM)"
kind = "credential"
role = "value"
status = "provisional"
source = "overview, Plug catalogue: x402 on EVM chains"
spec = "https://github.com/x402-foundation/x402/blob/main/specs/schemes/exact/scheme_exact_evm.md"
binding = "A"
use = "single"
refund = "none"
upto = false
properties = { theft = "bearer", link-payment = "linkable", link-actions = "linkable", issuer = "facilitator", verify = "online", finality = "freezable", custody = "self-custody", pq = "no", maturity = "experimental" }
local_id = "the payer address, 20 bytes, then the EIP-3009 authorization nonce, 32 bytes"
quota_id = ""
rail_refs = "evm: chain ID, token contract, payer and authorization nonce, confirmed by the rail after settlement"
rail_kinds = ["evm"]
verifiers = ["x402-facilitator:non-custodial", "x402-facilitator:custodial", "x402-facilitator:merchant-of-record"]
body = "the x402 payment payload: an EIP-3009 transferWithAuthorization signed by the payer, with nonce = Context"
witness = "none: class A; the payer's signature sits in the body and covers the Context, not the Digest"
native = []
units = ["eip155:8453/erc20:0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"]
conformance = ""
notes = "Each EVM network is its own scheme ID with its own entry; this one is Base (CAIP-2 eip155:8453) with USDC, as in the overview's Caparra config. Guarded, off by default. Only BNAP-aware clients can pay it: a tier-0 x402 client picks its own nonce, so it cannot set nonce = Context, and class A has no native path. The token issuer can freeze funds, hence freezable. One address pays every action, so payments and actions are linkable."

