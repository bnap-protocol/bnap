[scheme."cashu:nut24"]
name = "Cashu NUT-24 HTTP 402, tokens locked for the operator"
kind = "credential"
role = "value"
status = "provisional"
source = "overview, Plug catalogue: Cashu NUT-24, NUT-18, NUT-26"
spec = "https://github.com/cashubtc/nuts/blob/main/24.md"
binding = "O"
use = "single"
refund = "none"
upto = false
properties = { theft = "bearer", link-payment = "unlinkable", link-actions = "unlinkable", issuer = "third-party", verify = "online", finality = "final-at-settlement", custody = "third-party-custodial", pq = "no", maturity = "experimental" }
local_id = "Y of each proof, 33-byte compressed point"
quota_id = ""
rail_refs = "none: the ecash is itself the payment, and no rail kind covers third-party ecash yet"
rail_kinds = []
verifiers = ["local"]
body = "a cashuB token whose proofs carry the NUT-10 locking condition the request named, such as a NUT-11 P2PK lock to the operator's key"
witness = "none: class O has no witness"
native = [
  { kind = "cashu-request", embeds = "the request's NUT-10 locking condition ties the tokens to this offer; the adapter spec fixes how it carries the OfferID", credential = "the cashuB token from the X-Cashu field, as received" },
]
units = ["sat"]
conformance = ""
notes = "One catalogue row with two binding classes, so two IDs: this one admits only locked tokens (class O); cashu:nut24@unlocked takes the rest (class none). NUT-18 is the payment request and NUT-26 its bech32m encoding; both ride inside this scheme. Tokens come from a mint the operator trusts, so the mint holds the value and must be online to swap them."

