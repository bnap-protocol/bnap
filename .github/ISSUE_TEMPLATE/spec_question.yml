name: Spec question
description: Ask what the specification means, or point out an ambiguity.
labels: ["question"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: File and section, for example "socket-draft-00 6.4".
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Quote the passage and say how it can be read.
    validations:
      required: true
  - type: textarea
    id: readings
    attributes:
      label: Possible readings
      description: The readings you see and what an implementation would do differently under each.
  - type: input
    id: implementation
    attributes:
      label: Implementation
      description: The implementation you are working on, if any, and what it does today.
